<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lurniva RAG - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #16213e;
      border-radius: 15px;
      padding: 40px;
      border: 1px solid #0f3460;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #00d9ff;
      font-size: 2em;
      margin-bottom: 5px;
    }
    .logo p {
      color: #888;
      font-size: 0.9em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 0.9em;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1em;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #00d9ff;
    }
    input::placeholder {
      color: #666;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }
    .error.show {
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 0.8em;
    }
    .footer a {
      color: #00d9ff;
      text-decoration: none;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
      display: none;
    }
    .btn.loading-state .loading {
      display: inline-block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🔐 Lurniva RAG</h1>
      <p>API Test Console</p>
    </div>
    
    <div id="error" class="error"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn" id="loginBtn">
        <span class="loading"></span>
        <span class="btn-text">Login</span>
      </button>
    </form>
    
    <div class="footer">
      <p>Lurniva RAG Microservice v1.0.0</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // Show loading state
      loginBtn.classList.add('loading-state');
      loginBtn.disabled = true;
      errorDiv.classList.remove('show');
      
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Redirect to test console
          window.location.href = '/console';
        } else {
          errorDiv.textContent = result.error?.message || 'Invalid credentials';
          errorDiv.classList.add('show');
        }
      } catch (err) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.classList.add('show');
      } finally {
        loginBtn.classList.remove('loading-state');
        loginBtn.disabled = false;
      }
    });

    // Check if already logged in
    (async () => {
      try {
        const res = await fetch('/auth/check');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/console';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
